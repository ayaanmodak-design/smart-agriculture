<!DOCTYPE html>
<html>
<head>
    <title>Farmer Registration</title><style>
body { font-family: Arial, sans-serif; background-color: #f0fff0; margin: 0; }
h1, h2 { color: darkgreen; }
header { background-color: green; color: white; text-align: center; padding: 15px; }
nav { background-color: green; }
nav ul { list-style-type: none; margin: 0; padding: 0; }
nav ul li { display: inline-block; }
nav ul li a { display: inline-block; padding: 10px 15px; color: white; text-decoration: none; }
nav ul li a:hover { background-color: darkgreen; color: yellow; }
footer { background-color: darkgreen; color: white; text-align: center; padding: 10px; clear: both; }
.sidebar { float: left; width: 20%; background-color: #e6ffe6; padding: 10px; box-sizing: border-box; }
.content { float: left; width: 75%; padding: 10px; box-sizing: border-box; }
aside { border: 1px solid green; box-shadow: 3px 3px 6px gray; padding: 10px; border-radius: 8px; width: 200px; background-color: white; }
aside ul { list-style-type: none; padding-left: 0; }
aside li { padding: 6px; }
aside li:hover { background-color: lightgreen; }
.plot-card { display: inline-block; width: 200px; margin: 10px; padding: 10px; border: 1px solid gray; background-color: white; box-shadow: 2px 2px 5px gray; text-align: center; }
figure img { width: 250px; height: 180px; border: 2px solid green; margin: 10px; transition: transform 0.3s; }
figure img:hover { transform: scale(1.2); }
figure { display: inline-block; text-align: center; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid black; padding: 8px; text-align: center; }
th { background-color: green; color: white; }
tr:nth-child(even) { background-color: #e6ffe6; }
fieldset { border: 2px solid green; border-radius: 8px; padding: 15px; width: 300px; }
legend { color: darkgreen; font-weight: bold; }
input, select { width: 250px; padding: 5px; margin: 5px 0; border-radius: 4px; border: 1px solid gray; }
input:focus { border: 2px solid green; }
button { background-color: green; color: white; padding: 8px 15px; border: none; border-radius: 5px; }
button:hover { background-color: darkgreen; }
.alert-box { background-color: yellow; padding: 15px; font-size: 20px; text-shadow: 1px 1px 2px red; box-shadow: 0 0 10px red; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>

<header>
    <h1>Farmer Registration Form</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="registration.html">Register</a></li>
    </ul>
</nav>

<form action="#" method="post">
    <fieldset>
        <legend>Farmer Details</legend>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br>

        <label for="plotid">Plot ID:</label><br>
        <input type="text" id="plotid" name="plotid" placeholder="e.g. Plot-12" required><br>

        <label for="village">Village:</label><br>
        <input type="text" id="village" name="village"><br>

        <label for="cropstage">Crop Stage:</label><br>
        <select id="cropstage" name="cropstage">
            <option value="germination">Germination</option>
            <option value="tillering">Tillering</option>
            <option value="grand-growth">Grand Growth</option>
            <option value="maturity">Maturity</option>
        </select><br>

        <label for="soiltype">Soil Type:</label><br>
        <select id="soiltype" name="soiltype">
            <option value="clay">Clay</option>
            <option value="loamy">Loamy</option>
            <option value="sandy">Sandy</option>
        </select><br>

        <label for="irrigationmethod">Irrigation Method:</label><br>
        <select id="irrigationmethod" name="irrigationmethod">
            <option value="drip">Drip</option>
            <option value="flood">Flood</option>
            <option value="sprinkler">Sprinkler</option>
        </select><br>

        <label for="date">Date:</label><br>
        <input type="date" id="date" name="date"><br>

        <label for="photo">Farm Photo:</label><br>
        <input type="file" id="photo" name="photo"><br><br>

        <button type="submit">Register</button>
    </fieldset>
</form>

<footer>
    <p>&copy; 2026 KIAAR - Godavari Biorefineries Ltd.</p>
</footer>

</body>
</html>
